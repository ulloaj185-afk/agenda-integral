<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header class="menu-header">
      <div class="menu-brand">
        <ion-icon name="calendar-outline" class="brand-icon"></ion-icon>
        <div>
          <h2>Agenda Integral</h2>
          <p>Organizador Personal</p>
        </div>
      </div>
    </ion-header>

    <ion-content class="menu-content">
      <ion-list lines="none">
        <ion-list-header>ORGANIZACIÓN</ion-list-header>

        <ion-menu-toggle auto-hide="true">
          <ion-item button (click)="abrirOpcion('Mi perfil')">
            <ion-icon slot="start" name="person-circle-outline"></ion-icon>
            <ion-label>Mi perfil</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Calendario')">
            <ion-icon slot="start" name="calendar-outline"></ion-icon>
            <ion-label>Calendario</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Categorías')">
            <ion-icon slot="start" name="pricetag-outline"></ion-icon>
            <ion-label>Categorías</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Recordatorios')">
            <ion-icon slot="start" name="notifications-outline"></ion-icon>
            <ion-label>Recordatorios</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Actividades recurrentes')">
            <ion-icon slot="start" name="repeat-outline"></ion-icon>
            <ion-label>Actividades recurrentes</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Actividades importantes')">
            <ion-icon slot="start" name="star-outline"></ion-icon>
            <ion-label>Actividades importantes</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Estadísticas')">
            <ion-icon slot="start" name="stats-chart-outline"></ion-icon>
            <ion-label>Estadísticas</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-list-header class="header-datos">GESTIÓN DE DATOS</ion-list-header>

        <ion-menu-toggle auto-hide="true">
          <ion-item button (click)="abrirOpcion('Copia de seguridad')">
            <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
            <ion-label>Copia de seguridad</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Exportar actividades')">
            <ion-icon slot="start" name="download-outline"></ion-icon>
            <ion-label>Exportar actividades</ion-label>
          </ion-item>

          <ion-item button (click)="abrirOpcion('Papelera')">
            <ion-icon slot="start" name="trash-outline"></ion-icon>
            <ion-label>Papelera</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
